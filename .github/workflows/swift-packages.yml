# Compile-and-test verification for the reusable Swift packages.
#
# This job intentionally does NOT touch the macOS app target: that build needs
# XcodeGen to generate Strand.xcodeproj and a wired-up test scheme, and the app
# release is produced and anonymized by hand. The packages, by contrast, build
# and test on their own with plain SwiftPM — no Xcode project, no signing, no
# secrets — which makes them a safe, self-contained CI check that leaks nothing.
name: Swift Packages CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'Packages/**'
      - '.github/workflows/swift-packages.yml'
  # Fork change: build EVERY branch, not just main. A branch that only ever compiles once it has been
  # merged tests nothing — the point of working on a branch is to catch the break before it reaches main
  # (and, for a sideloaded install, before the phone auto-updates from main). The `paths` filter and the
  # cancel-in-progress concurrency group below still keep this cheap: a branch push that touches no
  # package file starts no job, and a rapid re-push cancels the previous run.
  push:
    branches: ['**']
    paths:
      - 'Packages/**'
      - '.github/workflows/swift-packages.yml'
  workflow_dispatch:

concurrency:
  group: swift-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        package:
          - WhoopProtocol
          - OuraProtocol
          - PolarProtocol
          - WhoopStore
          - StrandAnalytics
          - StrandImport
          - StrandDesign
          - NoopLocalAccess
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build ${{ matrix.package }}
        run: swift build
        working-directory: Packages/${{ matrix.package }}

      - name: Test ${{ matrix.package }}
        run: swift test
        working-directory: Packages/${{ matrix.package }}
